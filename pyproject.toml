[project]
name = "unsampled-truth"
version = "0.1.0"
description = "The Unsampled Truth: Quantifying Prompt Artifacts in LM Psychometrics"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.13.0",
    "matplotlib>=3.10.9",
    "mistral-common>=1.11.0",
    "nbformat>=5.10.4",
    "numpy>=2.0",
    "pandas>=3.0.2",
    "pyyaml>=6.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.66",
    "transformers>=5.6.2",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"
